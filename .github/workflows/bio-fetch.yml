# Тимчасово: зображення для розділу «Біоенергетичні основи біотехнологічних процесів».
name: Fetch bioenergetics media (temporary)

on:
  push:
    paths: ['tools/bio/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/bio/fetch.py final
        continue-on-error: true
      - run: python tools/bio/fetch.py search "$(cat tools/bio/only.txt 2>/dev/null || true)"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/bio
          git add -A assets/img/bio 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch bioenergetics media"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
