# Мінімізує HTML/CSS/JS і публікує сайт на GitHub Pages.
# Увімкнення: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/biotech-department-landing-85ytoa, claude/serene-bell-5fzu9d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (minify)
        run: |
          mkdir dist
          cp -r index.html about lab konspekt modeling microscope assets dist/
          cd dist
          # версія до CSS/JS, щоб після оновлення браузер не брав старі файли з кешу
          V="${GITHUB_SHA::8}"
          find . -name '*.html' -exec sed -i -E "s#(href|src)=\"([^\":]+\.(css|js))\"#\1=\"\2?v=$V\"#g" {} +
          npx --yes html-minifier-terser@7.2.0 --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true --input-dir . --output-dir . --file-ext html
          for f in assets/css/*.css; do npx --yes clean-css-cli@5.6.3 -O1 -o "$f" "$f"; done
          # --module (перейменування змінних верхнього рівня) — лише для ES-модулів з import/export.
          # Звичайні скрипти (plant-physiology.js + plant-physiology-2.js, bio/lab-*.js тощо) ділять
          # глобальну область: з --module обидва отримують «const e…» і другий падає з SyntaxError.
          for f in assets/js/*.js assets/js/lab/*.js assets/js/lab/bio/*.js; do
            [ -f "$f" ] || continue
            if grep -qE '^[[:space:]]*(import|export)[[:space:]{*]' "$f"; then
              npx --yes terser@5.36.0 "$f" --module -c -m -o "$f"
            else
              npx --yes terser@5.36.0 "$f" -c -m -o "$f"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
