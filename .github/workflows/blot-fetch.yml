# Тимчасово: зображення й перевірка літератури для статті «Блоттинг».
name: Fetch blotting media (temporary)

on:
  push:
    paths: ['tools/blot/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/blot/fetch.py "$(cat tools/blot/mode.txt 2>/dev/null || echo search)" "$(cat tools/blot/only.txt 2>/dev/null || true)"
      - run: python tools/blot/fetch.py refs
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/blot
          git add -A assets/img/blot 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch blot media"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
