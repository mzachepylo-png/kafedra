# Тимчасово: зображення для конспекту «Молекулярна генетика рослин» з Wikimedia Commons.
name: Fetch mgen media (temporary)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: search або final
        required: true
        default: search
      start:
        description: початковий індекс запиту (search)
        default: "0"
      end:
        description: кінцевий індекс запиту (search)
        default: "60"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/mgen/fetch.py "${{ inputs.mode }}" "${{ inputs.start }}" "${{ inputs.end }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/mgen assets/img/mgen tools/mgen/credits.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch mgen media: ${{ inputs.mode }} ${{ inputs.start }}-${{ inputs.end }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
