# Тимчасово: зображення для конспекту «Молекулярна генетика рослин» з Wikimedia Commons.
# Запускається пушем у tools/mgen/ ; режим — у tools/mgen/mode.txt ("search" або "final").
name: Fetch mgen media (temporary)

on:
  push:
    paths: ['tools/mgen/**']

permissions:
  contents: write

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "mode=$(cat tools/mgen/mode.txt 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

  search:
    needs: mode
    if: needs.mode.outputs.mode == 'search'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range: ["0 60", "60 120", "120 174"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/mgen/fetch.py search ${{ matrix.range }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/mgen
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch mgen media: search ${{ matrix.range }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep $((RANDOM % 10 + 3))
          done

  search2:
    needs: mode
    if: needs.mode.outputs.mode == 'search2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range: ["0 28", "28 56", "56 84"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/mgen/fetch.py search2 ${{ matrix.range }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/mgen
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch mgen media: search2 ${{ matrix.range }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep $((RANDOM % 10 + 3))
          done

  final:
    needs: mode
    if: needs.mode.outputs.mode == 'final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python tools/mgen/fetch.py final
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/mgen tools/mgen/credits.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch mgen media: final"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
